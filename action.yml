name: 'Karpathy PR Review'
description: 'Posts a Karpathy guidelines checklist on PRs and warns when diffs are too large.'
author: 'andrej-karpathy-skills'

inputs:
  github-token:
    description: 'GitHub token (use secrets.GITHUB_TOKEN)'
    required: true
  max-diff-lines:
    description: 'Line-change threshold before a "surgical changes" warning is added'
    default: '400'
  max-files-changed:
    description: 'File count threshold before a "surgical changes" warning is added'
    default: '15'

runs:
  using: 'composite'
  steps:
    - name: Post Karpathy review checklist
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const maxLines = parseInt('${{ inputs.max-diff-lines }}');
          const maxFiles = parseInt('${{ inputs.max-files-changed }}');
          const { owner, repo } = context.repo;
          const pr = context.payload.pull_request;
          if (!pr) { console.log('Not a pull_request event, skipping.'); return; }

          // Fetch diff stats for the PR
          const { data: prData } = await github.rest.pulls.get({
            owner, repo, pull_number: pr.number
          });

          const linesChanged = prData.additions + prData.deletions;
          const filesChanged = prData.changed_files;

          // Build diff-size warning block (only shown when thresholds are exceeded)
          let diffWarning = '';
          if (linesChanged > maxLines || filesChanged > maxFiles) {
            const linesPart = linesChanged > maxLines
              ? `**${linesChanged} lines changed** (threshold: ${maxLines})`
              : null;
            const filesPart = filesChanged > maxFiles
              ? `**${filesChanged} files changed** (threshold: ${maxFiles})`
              : null;
            const exceeded = [linesPart, filesPart].filter(Boolean).join(' · ');
            diffWarning = `
> [!WARNING]
> **Large diff detected** — ${exceeded}
> This may indicate changes beyond the minimal scope needed. Consider whether all changes trace directly to the task (Principle 3: Surgical Changes).

`;
          }

          const body = `## Karpathy Code Review Checklist
${diffWarning}
Use this checklist during review. Check off each item or leave a comment if something needs attention.

### 1. Think Before Coding
- [ ] Assumptions are stated explicitly — nothing was silently decided on the author's behalf
- [ ] If ambiguous, multiple interpretations were presented and the chosen one is justified
- [ ] Tradeoffs are surfaced; simpler alternatives are acknowledged if they exist

### 2. Simplicity First
- [ ] The change solves only what was asked — no speculative features or flexibility
- [ ] No unnecessary abstractions for single-use code
- [ ] If 200 lines could be 50, it's been simplified

### 3. Surgical Changes
- [ ] Only lines directly required by the task were modified
- [ ] Adjacent code, comments, and formatting were not "improved" as a side effect
- [ ] Style matches the existing codebase (quotes, types, spacing)
- [ ] Imports/variables made unused by *this* change have been removed

### 4. Goal-Driven Execution
- [ ] Success criteria are defined and verifiable (not just "make it work")
- [ ] Tests were written or updated to verify the change
- [ ] No regressions in existing tests

---
<sub>Posted by [andrej-karpathy-skills](https://github.com/ashwinsekar18/andrej-karpathy-skills) · Diff: +${prData.additions} / -${prData.deletions} across ${filesChanged} file(s)</sub>`;

          // Find an existing checklist comment to update (avoids comment spam on each push)
          const MARKER = '## Karpathy Code Review Checklist';
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number: pr.number, per_page: 100
          });
          const existing = comments.find(
            c => c.user.type === 'Bot' && c.body.startsWith(MARKER)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body
            });
            console.log(`Updated existing checklist comment #${existing.id}`);
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body
            });
            console.log('Created new checklist comment');
          }
